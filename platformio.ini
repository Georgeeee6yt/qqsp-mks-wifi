; QQS-Pro: MKS Wi-Fi module firmware (makerbase-mks/MKS-WIFI 39b8053, C1.0.4_201109_beta) built with PlatformIO.
; Core: makerbase-mks/Esp8266-Core-For-Arduino (2.4.0, Duet3D based) as a local package; see README.md.
[platformio]
src_dir = MksWifi

[env:mks]
platform = espressif8266@1.8.0
board = esp01_1m
framework = arduino
platform_packages = framework-arduinoespressif8266 @ file:///tmp/mksrc/mkscore
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.4m.ld
board_build.variant = generic
board_build.f_cpu = 80000000L
board_upload.maximum_size = 1044464
build_flags = -DF_CPU=80000000L -DARDUINO_ESP8266_ESP01 -DARDUINO_ARCH_ESP8266 -DARDUINO_BOARD=\"ESP8266_ESP01\" -DESP8266
extra_scripts = pre:flags.py
build_src_filter = +<*> -<PooledStrings.cpp>
