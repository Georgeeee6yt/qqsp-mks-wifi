<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QQ-S Pro</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#161616;--card:#222;--line:#333;--tx:#eee;--mut:#9a9a9a;--acc:#ff8c28;--ok:#4cc38a;--bad:#ff5a5a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;color:var(--acc);font-weight:700}
#st{margin-left:auto;font-size:13px;color:var(--mut);text-align:right}
main{max-width:560px;margin:0 auto;padding:12px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}
.mut{color:var(--mut);font-size:13px}
button{font:inherit;border-radius:8px;border:1px solid var(--acc);background:transparent;color:var(--acc);padding:8px 14px;cursor:pointer}
button.pri{background:var(--acc);color:#111;font-weight:700}
button:disabled{opacity:.4;cursor:default}
input[type=text],input[type=password]{width:100%;font:inherit;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:#111;color:var(--tx)}
label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mut)}
#drop{border:2px dashed var(--line);border-radius:10px;padding:22px 12px;text-align:center;cursor:pointer}
#drop.on{border-color:var(--acc)}
.bar{height:8px;background:#111;border-radius:4px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
#list{margin:8px 0 0;padding:0;list-style:none;max-height:300px;overflow:auto}
#list li{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer}
#list li:hover,#list li.sel{background:#2c2c2c}
#list .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sig{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.sig b{width:3px;background:#444;border-radius:1px}
.sig b.on{background:var(--acc)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;color:var(--mut)}
.seg button.on{background:var(--acc);color:#111}
.msg{margin-top:8px;font-size:14px;min-height:1.5em}
.ok{color:var(--ok)}.bad{color:var(--bad)}
[hidden]{display:none!important}
#pc .ban{display:block;width:100%;aspect-ratio:428/174;background:#222;border-radius:6px}
#pc .ban img{width:100%;height:100%;display:block}
#pc .ban img.px{image-rendering:pixelated}
.prow{display:flex;align-items:flex-end;gap:12px;margin-top:8px}
.pct{font-size:44px;font-weight:700;line-height:1}
.times{margin-left:auto;text-align:right;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.cd{border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.cd .k{font-size:12px;color:var(--mut)}.cd .v{font-size:20px;font-weight:700}
.cd.hot{border-color:var(--acc)}.cd.hot .v{color:#ff6a3d}
.cd.fan{border-color:#4a90d9}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13px}
.chip{border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--mut)}
.chip.warn{border-color:#e0a030;color:#e0a030}
#pstate{font-size:14px}
#files{margin:6px 0 0;padding:0;list-style:none}
#files li{border-bottom:1px solid var(--line)}
#files .it{display:flex;align-items:center;gap:10px;padding:9px 4px;cursor:pointer}
#files .it:hover{background:#2c2c2c}
#files .ic{width:20px;text-align:center;flex-shrink:0}
#files .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#files .sz{color:var(--mut);font-size:13px;flex-shrink:0}
#files .cf{display:flex;gap:8px;align-items:center;padding:0 4px 10px 34px;flex-wrap:wrap}
#crumb{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:14px}
#crumb a{color:var(--acc);cursor:pointer}
footer{text-align:center;padding:4px 0 20px}
footer a{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<header><h1>QQ-S Pro</h1><div id="st">讀取中…</div></header>
<main>

<section id="pc">
  <div class="row" style="justify-content:space-between"><h2 style="margin:0">印表機</h2><span id="pstate" class="mut">讀取中…</span></div>
  <div class="ban" style="margin-top:8px"><img id="anim" src="idle.gif" alt=""></div>
  <div id="job" hidden>
    <div class="mut" id="pname" style="margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></div>
    <div class="prow"><span class="pct" id="ppct">0%</span><span class="times"><span id="pel"></span><br><span class="mut" id="prem"></span></span></div>
    <div class="bar"><i id="ppb"></i></div>
  </div>
  <div class="cards">
    <div class="cd" id="cdh"><div class="k">噴頭 <span id="th"></span></div><div class="v" id="vh">--</div></div>
    <div class="cd" id="cdb"><div class="k">熱床 <span id="tb"></span></div><div class="v" id="vb">--</div></div>
    <div class="cd fan"><div class="k">風扇</div><div class="v" id="vf">--</div></div>
  </div>
  <div class="chips" id="chips" hidden><span class="chip" id="cv"></span><span class="chip" id="cw"></span><span class="chip" id="cz"></span></div>
  <div class="mut" id="pnote" style="margin-top:6px"></div>
</section>

<section>
  <div class="row" style="justify-content:space-between"><h2 style="margin:0">SD 卡</h2><button id="fref" style="padding:4px 10px">重新整理</button></div>
  <div id="crumb" style="margin-top:6px"></div>
  <ul id="files"></ul>
  <div class="msg" id="fmsg"></div>
</section>

<section>
  <h2>上傳 G-code</h2>
  <div id="drop">點這裡選檔案，或把檔案拖進來<br><span class="mut">存到印表機的 SD 卡</span></div>
  <input type="file" id="file" accept=".gcode,.gco,.g,.GCODE,.GCO,.G" hidden>
  <div id="up" hidden>
    <div class="row"><span id="fname" class="n"></span></div>
    <div class="bar"><i id="pb"></i></div>
    <div class="mut" id="pinfo"></div>
  </div>
  <div class="msg" id="umsg"></div>
</section>

<section>
  <h2>Wi-Fi 設定</h2>
  <div class="row">
    <div class="seg"><button id="mSta" class="on">連到家裡的網路</button><button id="mAp">自己開熱點</button></div>
  </div>

  <div id="staBox">
    <div class="row" style="margin-top:10px"><button id="scan">掃描附近的網路</button><span class="mut" id="smsg"></span></div>
    <ul id="list"></ul>
    <label for="ssid">網路名稱</label>
    <input type="text" id="ssid" maxlength="31" autocomplete="off" autocapitalize="off" spellcheck="false">
  </div>
  <div id="apBox" hidden>
    <label for="apname">熱點名稱</label>
    <input type="text" id="apname" maxlength="31" value="QQS-Pro" autocomplete="off" autocapitalize="off" spellcheck="false">
  </div>
  <label for="pw" id="pwl">密碼</label>
  <div class="row" style="flex-wrap:nowrap">
    <input type="password" id="pw" maxlength="63" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="eye" title="顯示密碼" style="padding:8px 10px;white-space:nowrap;flex-shrink:0">顯示</button>
  </div>
  <div class="mut" id="pwh"></div>
  <div class="row" style="margin-top:14px"><button id="apply" class="pri">套用並重開模組</button></div>
  <div class="msg" id="wmsg"></div>
</section>

<footer><a href="/config.htm">原本的 MKS 設定頁（更新模組韌體／網頁）</a><br><span id="mem"></span></footer>
</main>

<script>
const $ = id => document.getElementById(id);
let st = null, uploading = false, mode = 'sta';

function bars(rssi) {
  const n = rssi >= -55 ? 4 : rssi >= -67 ? 3 : rssi >= -78 ? 2 : 1;
  let h = '<span class="sig">';
  for (let i = 1; i <= 4; i++) h += '<b class="' + (i <= n ? 'on' : '') + '" style="height:' + (3 + i * 3) + 'px"></b>';
  return h + '</span>';
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function msg(el, text, cls) { el.className = 'msg ' + (cls || ''); el.textContent = text; }

// ---- printer card (Marlin QQS v3.2.13+ answers M2012; the module passes it on as pr / pn / age) ----
const ST = ['閒置中', '列印中', '加熱中', '暫停', '停止中'];
const ANIM = ['idle.gif', 'print.gif', 'heat.gif', 'pause.gif', 'pause.gif'];
let animNow = '';
function hm(s) { s = Math.max(0, s | 0); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60; return h + ':' + String(m).padStart(2, '0'); }
function setAnim(f) { if (f === animNow) return; animNow = f; const i = $('anim'); i.src = f; i.className = f === 'idle.gif' ? '' : 'px'; }
function printer(st) {
  const kv = {};
  for (const t of (st.pr || '').split(' ')) { const i = t.indexOf('='); if (i > 0) kv[t.slice(0, i)] = t.slice(i + 1); }
  if (!('s' in kv)) {
    setAnim('idle.gif'); $('job').hidden = true; $('chips').hidden = true;
    $('pstate').textContent = st.printing ? '列印中' : '閒置中';
    $('pnote').textContent = st.age < 0 ? '主板韌體 v3.2.13 以上才會顯示溫度和進度。' : '';
    return;
  }
  const s = +kv.s, num = v => (v || '0/0').split('/').map(Number);
  const [h, ht] = num(kv.t), [b, bt] = num(kv.b);
  const stale = st.age > 15000;
  $('pstate').textContent = stale ? '主板沒有回應' : ST[s] || '';
  setAnim(stale ? 'idle.gif' : ANIM[s] || 'idle.gif');
  $('vh').textContent = (h / 10).toFixed(0) + '°'; $('th').textContent = ht ? '→ ' + ht + '°' : '';
  $('vb').textContent = (b / 10).toFixed(0) + '°'; $('tb').textContent = bt ? '→ ' + bt + '°' : '';
  $('cdh').className = 'cd' + (ht ? ' hot' : ''); $('cdb').className = 'cd' + (bt ? ' hot' : '');
  $('vf').textContent = (kv.f || 0) + '%';
  const job = s > 0;
  if (job !== jobOn) { jobOn = job; $('files').querySelectorAll('.cf button.pri').forEach(b => b.disabled = jobOn); }
  $('job').hidden = !job; $('chips').hidden = !job;
  if (job) {
    const p = +kv.p || 0;
    $('pname').textContent = st.pn || '';
    $('ppct').textContent = p + '%'; $('ppb').style.width = p + '%';
    $('pel').textContent = '已印 ' + hm(+kv.e);
    $('prem').textContent = +kv.r >= 0 ? '剩餘 ' + hm(+kv.r) : '剩餘 --:--';
    const z = (+kv.z || 0) / 100;
    $('cv').textContent = '速度 ' + kv.v + '%'; $('cv').className = 'chip' + (+kv.v !== 100 ? ' warn' : '');
    $('cw').textContent = '流量 ' + kv.w + '%'; $('cw').className = 'chip' + (+kv.w !== 100 ? ' warn' : '');
    $('cz').textContent = 'Z 微調 ' + (z > 0 ? '+' : '') + z.toFixed(2); $('cz').className = 'chip' + (z ? ' warn' : '');
  }
  $('pnote').textContent = '';
}

async function status() {
  if (uploading) return;
  try {
    const r = await fetch('/status', {cache: 'no-store'});
    st = await r.json();
    printer(st);
    $('st').innerHTML = esc(st.ip) + '<br>' + (st.mode === 'ap' ? '熱點 ' + esc(st.ssid) : esc(st.ssid) + ' ' + bars(st.rssi));
    if (st.heap) $('mem').textContent = '模組 ' + esc(st.ver || '') + '　可用記憶體 ' + (st.heap / 1024).toFixed(1) + ' KB' + (st.hmin ? '（最低 ' + (st.hmin / 1024).toFixed(1) + ' KB）' : '');
    if (!uploading) {
      $('drop').style.opacity = st.printing ? .4 : 1;
      if (st.printing) msg($('umsg'), '列印中不能上傳', 'bad');
      else if ($('umsg').textContent === '列印中不能上傳') msg($('umsg'), '');
    }
  } catch (e) { $('st').textContent = '連不到模組'; }
}

// ---- upload ----
$('drop').onclick = () => { if (!uploading) $('file').click(); };
$('drop').ondragover = e => { e.preventDefault(); $('drop').classList.add('on'); };
$('drop').ondragleave = () => $('drop').classList.remove('on');
$('drop').ondrop = e => { e.preventDefault(); $('drop').classList.remove('on'); if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); };
$('file').onchange = () => { if ($('file').files[0]) upload($('file').files[0]); $('file').value = ''; };

// ---- SD card list / start a print (Marlin QQS v3.2.14+ answers M2013 / M2014 through the module) ----
let crumbs = [], flist = null, fbusy = false, jobOn = false;
const hexOf = s => Array.from(new TextEncoder().encode(s), b => b.toString(16).padStart(2, '0').toUpperCase()).join('');
const pathHex = cs => cs.map(c => '2F' + c.hex).join('');
const sleep = ms => new Promise(r => setTimeout(r, ms));
function fsz(b) { return b < 1048576 ? Math.max(1, Math.round(b / 1024)) + ' KB' : (b / 1048576).toFixed(1) + ' MB'; }
async function jget(u) { const r = await fetch(u, {cache: 'no-store'}); return r.json(); }

async function listDir(cs, quiet) {
  if (fbusy) return null;
  fbusy = true; $('fref').disabled = true;
  if (!quiet) msg($('fmsg'), '讀取中…');
  let res = null;
  try {
    for (let attempt = 0; attempt < 2 && !res; attempt++) {
      const d = pathHex(cs);
      const g = await jget('/files?go=1&d=' + d);
      if (g.st === 'busy') { msg($('fmsg'), '模組正在傳檔，等一下再試', 'bad'); break; }
      const t0 = Date.now();
      while (Date.now() - t0 < 15000) {
        await sleep(300);
        const r = await jget('/files');
        if (r.st === 'wait') continue;
        if (r.st === 'ok' && r.d === d) {
          if (r.code === 0 && r.got < r.total && attempt === 0) break;   // lines lost on the way: ask once more
          res = r;
        }
        else if (r.st === 'timeout') msg($('fmsg'), '印表機沒有回應：主板韌體要 v3.2.14 以上', 'bad');
        break;
      }
    }
  } catch (e) { msg($('fmsg'), '連不到模組', 'bad'); }
  fbusy = false; $('fref').disabled = false;
  if (!res) return null;
  if (res.code === 3) { msg($('fmsg'), '找不到這個資料夾', 'bad'); return null; }
  if (res.code === 4) { msg($('fmsg'), '讀不到 SD 卡', 'bad'); return null; }
  if (res.code === 5) { msg($('fmsg'), '路徑不對', 'bad'); return null; }
  crumbs = cs;
  // directory order: folders first, then files newest first (like the printer's list)
  const all = res.f.map(([dir, size, hex, name]) => ({dir: !!dir, size, hex, name}));
  flist = all.filter(e => e.dir).reverse().concat(all.filter(e => !e.dir).reverse());
  drawFiles();
  msg($('fmsg'), flist.length ? '' : '這裡沒有 G-code 檔案');
  if (res.code === 1) msg($('fmsg'), '檔案太多，只列出前 ' + res.got + ' 個');
  return flist;
}

function drawFiles() {
  const c = $('crumb'); c.innerHTML = ''; c.hidden = !crumbs.length;   // only inside a folder
  const root = document.createElement('a'); root.textContent = 'SD 卡'; root.onclick = () => listDir([]);
  c.appendChild(root);
  crumbs.forEach((k, i) => {
    c.appendChild(document.createTextNode(' › '));
    const a = document.createElement('a'); a.textContent = k.name; a.onclick = () => listDir(crumbs.slice(0, i + 1));
    c.appendChild(a);
  });
  const ul = $('files'); ul.innerHTML = '';
  for (const e of flist || []) {
    const li = document.createElement('li');
    li.innerHTML = '<div class="it"><span class="ic">' + (e.dir ? '📁' : '🧊') + '</span><span class="n"></span><span class="sz">' + (e.dir ? '' : fsz(e.size)) + '</span></div>';
    li.querySelector('.n').textContent = e.name;
    li.querySelector('.it').onclick = () => {
      if (e.dir) { listDir(crumbs.concat([{name: e.name, hex: e.hex}])); return; }
      const open = li.querySelector('.cf');
      ul.querySelectorAll('.cf').forEach(x => x.remove());
      if (open) return;
      const cf = document.createElement('div'); cf.className = 'cf';
      const go = document.createElement('button'); go.className = 'pri'; go.textContent = '開始列印';
      const no = document.createElement('button'); no.textContent = '取消';
      const note = document.createElement('span'); note.className = 'mut';
      go.disabled = jobOn; if (jobOn) note.textContent = '印表機正在列印';
      go.onclick = () => startPrint(crumbs.concat([{name: e.name, hex: e.hex}]), e.name);
      no.onclick = () => cf.remove();
      const full = document.createElement('div'); full.className = 'mut'; full.style.cssText = 'width:100%;word-break:break-all';
      full.textContent = e.name;
      if (li.querySelector('.n').scrollWidth > li.querySelector('.n').clientWidth) cf.append(full);   // name cut in the row
      cf.append(go, no, note); li.appendChild(cf);
    };
    ul.appendChild(li);
  }
}

const PRINT_ERR = {1: '印表機已經有工作在進行', 2: '印表機正在使用其他功能（移動中，或不在主畫面／選檔畫面），回到主畫面再試', 3: '找不到這個檔案，請重新整理清單', 4: '讀不到 SD 卡', 5: '路徑太長（資料夾太深）', 9: '模組正在傳檔'};
async function startPrint(cs, name) {
  $('files').querySelectorAll('.cf button').forEach(b => b.disabled = true);
  msg($('fmsg'), '送出中…');
  let r = {r: -1};
  try {
    r = await jget('/print?go=1&f=' + pathHex(cs));
    const t0 = Date.now();
    while (r.r < 0 && Date.now() - t0 < 6000) { await sleep(300); r = await jget('/print'); }
  } catch (e) { msg($('fmsg'), '連不到模組', 'bad'); return; }
  if (r.r === 0) {
    msg($('fmsg'), '已開始列印：' + name, 'ok');
    $('files').querySelectorAll('.cf').forEach(x => x.remove());
    status(); $('pc').scrollIntoView({behavior: 'smooth'});
  }
  else msg($('fmsg'), r.r < 0 ? '印表機沒有回應：主板韌體要 v3.2.14 以上' : (PRINT_ERR[r.r] || '印表機拒絕（' + r.r + '）'), 'bad');
  $('files').querySelectorAll('.cf button.pri').forEach(b => b.disabled = jobOn);
}
$('fref').onclick = () => listDir(crumbs);

// After an upload: find the new file in the root list and offer to print it
async function printUploaded(name) {
  const l = await listDir([], true);
  const e = l && l.find(x => !x.dir && x.name === name) || l && l.find(x => !x.dir && x.name.toLowerCase() === name.toLowerCase());
  if (!e) { msg($('umsg'), '在 SD 卡根目錄找不到「' + name + '」', 'bad'); return; }
  startPrint([{name: e.name, hex: e.hex}], e.name);
}

function upload(f) {
  if (uploading) return;
  if (st && st.printing) { msg($('umsg'), '列印中不能上傳', 'bad'); return; }
  uploading = true;
  $('up').hidden = false; $('fname').textContent = f.name; $('pb').style.width = '0';
  msg($('umsg'), '');
  const t0 = Date.now();
  const x = new XMLHttpRequest();
  x.open('POST', '/upload?X-Filename=' + encodeURIComponent(f.name));
  x.upload.onprogress = e => {
    if (!e.lengthComputable) return;
    const p = e.loaded / e.total, s = (Date.now() - t0) / 1000, kbs = s > 0 ? e.loaded / 1024 / s : 0;
    $('pb').style.width = (p * 100).toFixed(1) + '%';
    const left = kbs > 0 ? Math.round((e.total - e.loaded) / 1024 / kbs) : 0;
    $('pinfo').textContent = (e.loaded / 1048576).toFixed(1) + ' / ' + (e.total / 1048576).toFixed(1) + ' MB　' + kbs.toFixed(0) + ' KB/s　還要約 ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
  };
  x.onload = () => {
    uploading = false;
    let ok = x.status === 200;
    try { ok = ok && JSON.parse(x.responseText).err === 0; } catch (e) {}
    if (ok) {
      $('pb').style.width = '100%';
      msg($('umsg'), '已存到 SD 卡：' + f.name + '（' + ((Date.now() - t0) / 1000).toFixed(0) + ' 秒）', 'ok');
      const b = document.createElement('button'); b.className = 'pri'; b.textContent = '開始列印這個檔'; b.style.marginLeft = '8px';
      b.disabled = jobOn;
      b.onclick = () => { b.disabled = true; printUploaded(f.name).then(() => { $('pc').scrollIntoView({behavior: 'smooth'}); }); };
      $('umsg').appendChild(b);
      setTimeout(() => listDir(crumbs, true), 300);
    }
    else if (x.status === 409) msg($('umsg'), '印表機正在列印或傳檔，等一下再傳', 'bad');
    else msg($('umsg'), '上傳失敗（' + x.status + '）：印表機沒有接收，請看印表機畫面', 'bad');
    status();
  };
  x.onerror = () => { uploading = false; msg($('umsg'), '連線中斷，上傳沒有完成', 'bad'); status(); };
  x.send(f);
}

// ---- Wi-Fi ----
function setMode(m) {
  mode = m;
  $('mSta').className = m === 'sta' ? 'on' : ''; $('mAp').className = m === 'ap' ? 'on' : '';
  $('staBox').hidden = m !== 'sta'; $('apBox').hidden = m !== 'ap';
  $('pwl').textContent = m === 'ap' ? '熱點密碼（空白＝不設密碼）' : '密碼';
  $('pwh').textContent = m === 'ap' ? '要設密碼的話至少 8 個字。之後用手機連這個熱點，網址通常是 192.168.4.1。' : '';
}
$('mSta').onclick = () => setMode('sta');
$('mAp').onclick = () => setMode('ap');
$('eye').onclick = () => { const t = $('pw').type === 'password'; $('pw').type = t ? 'text' : 'password'; $('eye').textContent = t ? '隱藏' : '顯示'; };

$('scan').onclick = async () => {
  $('scan').disabled = true; $('smsg').textContent = '掃描中（約 3 秒）…'; $('list').innerHTML = '';
  try {
    const r = await fetch('/scan', {cache: 'no-store'});
    const nets = await r.json();
    $('smsg').textContent = nets.length ? '找到 ' + nets.length + ' 個' : '沒有找到網路';
    for (const n of nets) {
      const li = document.createElement('li');
      li.innerHTML = bars(n.rssi) + '<span class="n">' + esc(n.ssid) + '</span>' + (n.enc ? '<span class="mut">🔒</span>' : '<span class="mut">開放</span>');
      li.onclick = () => {
        for (const o of $('list').children) o.classList.remove('sel');
        li.classList.add('sel'); $('ssid').value = n.ssid; $('pw').value = ''; if (n.enc) $('pw').focus();
      };
      $('list').appendChild(li);
    }
  } catch (e) { $('smsg').textContent = '掃描失敗'; }
  $('scan').disabled = false;
};

$('apply').onclick = async () => {
  const name = (mode === 'ap' ? $('apname').value : $('ssid').value).trim(), pw = $('pw').value;
  if (!name) { msg($('wmsg'), mode === 'ap' ? '請輸入熱點名稱' : '請選一個網路或輸入名稱', 'bad'); return; }
  if (mode === 'ap' && pw.length > 0 && pw.length < 8) { msg($('wmsg'), '熱點密碼至少 8 個字（或留空）', 'bad'); return; }
  const what = mode === 'ap' ? '改成自己開熱點「' + name + '」' : '連到「' + name + '」';
  if (!confirm(what + '？\n\n模組會存檔並重開，這個頁面會斷線。' + (mode === 'sta' ? '連上後的新 IP 請看印表機的 Wi-Fi 分頁。\n連不上的話，模組大約 30 秒後會自己開一個 MKSWIFI 開頭的熱點，也可以在印表機上重新設定。' : '\n重開後請用手機連熱點，網址通常是 192.168.4.1。'))) return;
  $('apply').disabled = true;
  const q = 'wifi_mode=' + (mode === 'ap' ? 'wifi_mode_ap' : 'wifi_mode_sta') + '&hidden_ssid=' + encodeURIComponent(name) + '&password=' + encodeURIComponent(pw);
  try {
    const r = await fetch('/update_cfg?' + q, {cache: 'no-store'});
    const t = await r.text();
    if (r.ok && /success/i.test(t)) msg($('wmsg'), '已存檔，模組重開中。' + (mode === 'sta' ? '新的 IP 會顯示在印表機的 Wi-Fi 分頁。' : '請改連熱點「' + name + '」。'), 'ok');
    else msg($('wmsg'), '模組沒有接受：' + t.replace(/<[^>]+>/g, ' ').trim(), 'bad');
  } catch (e) { msg($('wmsg'), '已送出，模組應該正在重開。', 'ok'); }
  $('apply').disabled = false;
};

setMode('sta');
status();
// The list after the animations have loaded (the module serves one request at a time)
window.addEventListener('load', () => setTimeout(() => listDir([]), 300));
setInterval(() => { if (document.visibilityState === 'visible') status(); }, 2000);
</script>
